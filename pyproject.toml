[build-system]
requires = ["setuptools==80.10.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-collective-wisdom"
version = "0.1.0.dev0"
description = "External Hermes Collective Wisdom plugin, under development."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "packaging==26.0",
  "pydantic==2.13.4",
  "requests==2.33.0",
  "rich>=14.3.3,<16",
  "ruamel.yaml==0.18.17",
]

[project.optional-dependencies]
mutation = ["mutmut==3.8.0"]
dev = [
  "build==1.6.1",
  "fastapi==0.133.1",
  "httpx==0.28.1",
  "mccabe==0.7.0",
  "pre-commit==4.6.2",
  "pylint==4.0.8",
  "pytest==9.1.1",
  "python-telegram-bot==22.8",
  "slack-sdk==3.44.1",
]

[tool.setuptools]
packages = ["hermes_wisdom_plugin"]
include-package-data = false

[tool.setuptools.package-data]
hermes_wisdom_plugin = ["contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root is a native loader, not a normal Python test package.
addopts = "--confcutdir=tests"

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 100