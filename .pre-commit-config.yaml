repos:
  - repo: local
    hooks:
      - id: wisdom-complexity-ratchet
        name: Wisdom complexity ratchet
        entry: python scripts/check_complexity.py --staged
        language: python
        additional_dependencies: [mccabe==0.7.0]
        always_run: true
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]
